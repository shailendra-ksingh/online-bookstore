spring.application.name=bookstore-backend

# In-memory H2 database used for this coding assignment.
spring.datasource.url=jdbc:h2:mem:bookstore
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Run data.sql after Hibernate has created the database schema.
spring.jpa.defer-datasource-initialization=true

# Enable H2 console for local development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Application server.
server.port=8080

# Application logging.
logging.level.org.springframework=INFO
logging.level.com.bookstore=INFO

# React frontend URL allowed by CORS.
app.cors.allowed-origin=http://localhost:5173